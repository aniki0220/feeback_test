<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>意見回饋</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: var(--card);
      width: min(480px, 100%);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.25);
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>意見回饋表</h1>
      <p>歡迎留下您的寶貴意見，我們會盡快回覆。</p>
      <form>
        <label>
          姓名
          <input type="text" name="name" placeholder="請輸入您的姓名" required />
        </label>
        <label>
          電話
          <input type="tel" name="phone" placeholder="請輸入聯絡電話" required />
          <span class="hint">例如：09xx-xxx-xxx</span>
        </label>
        <label>
          意見
          <textarea name="feedback" placeholder="請輸入您的意見" required></textarea>
        </label>
        <button type="submit">送出意見</button>
        <span class="hint" data-status aria-live="polite"></span>
      </form>
    </section>
  </main>
  <script>
    const scriptURL =
      "https://script.google.com/macros/s/AKfycbyjZQ74cMAZNpsPgGk_ob5PMwmlIc1Xnuwdx10TGtw1AADX9rpBAs7fGngsiSTNO9hmiw/exec";
    const form = document.querySelector("form");
    const statusText = document.querySelector("[data-status]");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const submitButton = form.querySelector("button[type='submit']");
      const formData = new FormData(form);
      const payload = {
        name: formData.get("name"),
        phone: formData.get("phone"),
        message: formData.get("feedback"),
      };

      submitButton.disabled = true;
      submitButton.textContent = "送出中...";
      statusText.textContent = "";

      fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "application/json" },
      })
        .then(() => {
          statusText.textContent = "送出成功！感謝您的回饋。";
          form.reset();
        })
        .catch(() => {
          statusText.textContent = "送出失敗，請稍後再試。";
        })
        .finally(() => {
          submitButton.disabled = false;
          submitButton.textContent = "送出意見";
        });
    });
  </script>
</body>
</html>
